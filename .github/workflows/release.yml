name: Release

# Cuts a DRAFT release from a tag, walking the GreyNOC release bar:
#   validation suite -> locked build -> artifact verification -> SBOM ->
#   checksums -> drafted release.
#
# Two deliberate properties:
#
# 1. It builds from the TAG, and checks the tag is reachable from main.
#    v0.2.0 was once tagged with a fix that main did not contain, so the
#    default branch shipped behaviour the release had already fixed. A
#    release that silently diverges from main is exactly the failure this
#    guards.
#
# 2. It DRAFTS rather than publishes. Publishing is an outward-facing act and
#    stays a human decision; the binaries are also unsigned, which an
#    operator must acknowledge rather than have automation wave through.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (must already exist)'
        required: true

permissions:
  contents: write

jobs:
  validate:
    name: validation suite
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,designer]"
      - name: Run the validation suite
        run: python -m pytest tests -q --tb=short -p no:warnings

      - name: Tag must be reachable from main
        shell: bash
        run: |
          git fetch origin main --depth=200
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "OK: this commit is contained in main"
          else
            echo "::error::This tag is NOT reachable from main. Releasing it would"
            echo "::error::ship code the default branch does not have (this happened"
            echo "::error::to v0.2.0). Merge to main first, then re-tag."
            exit 1
          fi

  build:
    name: locked build + artifact verification
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the LOCKED build environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements-build.lock
          python -m pip install -e . --no-deps

      - name: Version in code must match the tag
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          CODE="v$(python -c 'import rydsim; print(rydsim.__version__)')"
          echo "tag=$TAG code=$CODE"
          [ "$TAG" = "$CODE" ] || { echo "::error::tag $TAG != code version $CODE"; exit 1; }

      - name: Build both binaries
        run: python -m PyInstaller packaging/rydsim.spec --noconfirm --distpath dist --workpath build/pyinstaller

      - name: Verify the ARTIFACTS
        # Build success proves nothing — see packaging/smoke_test.py.
        run: python packaging/smoke_test.py dist/rydsim-cli.exe dist/RydSim.exe

      - name: Generate the SBOM from the locked build environment
        shell: bash
        run: |
          VER="${{ github.event.inputs.tag || github.ref_name }}"
          VER="${VER#v}"
          python -m pip install cyclonedx-bom
          python -m cyclonedx_py environment --output-format JSON --output-reproducible \
            -o "dist/rydsim-${VER}-sbom.cdx.json"
          python - <<'PY'
          import glob, json
          f = glob.glob("dist/*sbom*.json")[0]
          d = json.load(open(f, encoding="utf-8"))
          names = [c["name"].lower() for c in d.get("components", [])]
          bad = [n for n in names if any(k in n for k in ("torch", "cuda", "transformers"))]
          assert not bad, f"SBOM contains unexpected heavy components: {bad}"
          print(f"SBOM OK: {len(names)} components")
          PY

      - name: Package the portable bundle and checksums
        shell: bash
        run: |
          VER="${{ github.event.inputs.tag || github.ref_name }}"
          VER="${VER#v}"
          mkdir -p dist/release
          cp dist/RydSim.exe dist/rydsim-cli.exe LICENSE README.md CHANGELOG.md \
             THIRD-PARTY-NOTICES.md dist/rydsim-${VER}-sbom.cdx.json dist/release/
          [ -f dist/START-HERE.txt ] && cp dist/START-HERE.txt dist/release/ || true
          cd dist/release && 7z a -tzip "../rydsim-${VER}-windows-x64-portable.zip" . >/dev/null && cd ../..
          cd dist && sha256sum RydSim.exe rydsim-cli.exe \
            "rydsim-${VER}-windows-x64-portable.zip" "rydsim-${VER}-sbom.cdx.json" > SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VER="${TAG#v}"
          {
            echo "Draft built by CI from \`$TAG\`, verified against the artifact rather than the source."
            echo
            echo "- Validation suite: passed"
            echo "- Tag confirmed reachable from \`main\`"
            echo "- Binaries verified by \`packaging/smoke_test.py\` (startup, frozen physics, findings location, refusals, hygiene)"
            echo "- SBOM generated from the locked build environment"
            echo
            echo "### ⚠️ Unsigned"
            echo "These binaries are **not code-signed**; SmartScreen will warn. Checksums are published in place of a signature, which detects corruption in transit but not a substituted download."
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
            echo
            echo "Edit these notes before publishing. See CHANGELOG.md."
          } > notes.md
          gh release create "$TAG" --draft --title "RydSim $TAG" --notes-file notes.md \
            dist/RydSim.exe dist/rydsim-cli.exe \
            "dist/rydsim-${VER}-windows-x64-portable.zip" \
            "dist/rydsim-${VER}-sbom.cdx.json" dist/SHA256SUMS.txt \
            || gh release upload "$TAG" dist/RydSim.exe dist/rydsim-cli.exe \
               "dist/rydsim-${VER}-windows-x64-portable.zip" \
               "dist/rydsim-${VER}-sbom.cdx.json" dist/SHA256SUMS.txt --clobber
