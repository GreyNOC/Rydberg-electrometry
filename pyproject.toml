[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rydsim"
version = "0.2.0"
description = "GreyNOC RydSim — scientifically validated Rydberg-atom electrometry simulator (EIT/Autler-Townes, Stark, superheterodyne) with calibration-study findings pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "GreyNOC" }]
dependencies = [
    # np.trapezoid (used on the Doppler, EIT, objective and radial paths)
    # is NumPy 2.0+. The old >=1.26 floor was factually wrong: a resolver
    # landing on 1.26 raises AttributeError inside the core physics.
    "numpy>=2.0",
    # These floors must be MUTUALLY SATISFIABLE with numpy>=2.0, not merely
    # individually old enough. scipy 1.11 caps numpy below 1.28 and
    # matplotlib 3.8 likewise predates numpy 2, so the previous set
    # (numpy>=2.0, scipy>=1.11, matplotlib>=3.8) was unsatisfiable: pip
    # rejects it with ResolutionImpossible. A user resolving to our declared
    # minimums could not install the package at all. scipy 1.13 and
    # matplotlib 3.9 are the first releases of each that accept numpy 2.
    # Verified by resolution, not by reading changelogs — see the
    # declared-dependencies CI job, which installs exactly these floors and
    # then runs real physics through them.
    "scipy>=1.13",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
# sympy is the exact-symbolic ORACLE the Wigner tests check the float and
# exact-rational paths against — a test-only dependency by design: shipping
# an oracle alongside the thing it validates would defeat the point.
dev = ["pytest>=8", "pytest-xdist>=3", "sympy>=1.12"]
# The DESIGNER search layer (rydsim.designer) needs scikit-learn for the GP
# surrogate and the feasibility classifier. Kept optional so the physics
# engine, CLI and GUI install without it; rydsim.designer raises a clear
# ImportError naming this extra if it is missing.
designer = ["scikit-learn>=1.4"]

[project.scripts]
rydsim = "rydsim.cli:main"

[project.gui-scripts]
rydsim-gui = "rydsim.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
